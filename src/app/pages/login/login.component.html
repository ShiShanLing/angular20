<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <img src="logo.svg" alt="工坊" class="login-logo" width="56" height="56" />
      <h2 class="login-title">工坊</h2>
      <p class="login-sub">使用 Agent 统一账号登录</p>
    </div>

    <button
      nz-button
      nzType="primary"
      nzBlock
      nzSize="large"
      class="agent-login-btn"
      [nzLoading]="loading()"
      (click)="onAgentLogin()"
    >
      使用统一账号登录
    </button>
    <button
      type="button"
      nz-button
      nzBlock
      class="guest-btn"
      [disabled]="loading()"
      (click)="onGuestEnter()"
    >
      游客访问
    </button>
    <p class="guest-hint">没有账号请先到 Agent 注册。游客可使用工具与游戏，记录不会保存。</p>
  </div>
</div>

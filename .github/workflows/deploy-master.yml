name: Deploy master to server

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Call server deploy hook
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "https://${SERVER_HOST}/angular20/api/deploy/hook" \
            -H "X-Deploy-Token: ${DEPLOY_HOOK_SECRET}" \
            -H "Content-Type: application/json")"
          echo "$response"
          run_id="$(node -e 'const data=JSON.parse(process.argv[1]); if (!data.runId) process.exit(1); process.stdout.write(data.runId);' "$response")"

          for i in $(seq 1 60); do
            status_response="$(curl -fsS "https://${SERVER_HOST}/angular20/api/deploy/runs/${run_id}" \
              -H "X-Deploy-Token: ${DEPLOY_HOOK_SECRET}")"
            echo "$status_response"
            state="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.state || "unknown");' "$status_response")"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "Deploy did not finish within the GitHub Actions timeout."
          exit 1
